<script>
const KEY='cixu-account-cache-v1';
const $=s=>document.querySelector(s); const app=$('#app');
let words=[], view='dashboard', session=null, currentUser=null, saveTimer=null;
const todayKey=()=>new Date().toISOString().slice(0,10);
const defaults=()=>({createdAt:new Date().toISOString(),planStart:null,planDays:20,screenOrder:[],status:{},daily:{},history:{},stage3:{index:0,order:[],passed:0,wrong:0,totalMs:0,questionAt:0},settings:{sessionSize:50}});
let state=defaults();
function cacheKey(){return `${KEY}-${currentUser?.username||'guest'}`}
function loadCache(){try{return {...defaults(),...JSON.parse(localStorage.getItem(cacheKey())||'{}')}}catch{return defaults()}}
function save(){localStorage.setItem(cacheKey(),JSON.stringify(state));if($('#saveDot'))$('#saveDot').animate([{opacity:.2},{opacity:1}],{duration:350});clearTimeout(saveTimer);if(currentUser)saveTimer=setTimeout(()=>fetch('/api/progress',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)}).catch(()=>{}),250)}
function st(id){return state.status[id]||{stage:'new',correct:0,wrong:0,due:null,last:null}}
function setst(id,v){state.status[id]={...st(id),...v};save()}
function toast(t){let el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function esc(s=''){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function cleanMeaning(s){return s.replace(/\[[^\]]+\]/g,'').replace(/(?:n|v|vt|vi|a|adv)\.\s*/g,'').split('；')[0].slice(0,85)}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function addHistory(type){let d=todayKey();state.history[d]=state.history[d]||{screened:0,studied:0,correct:0};state.history[d][type]++;save()}
function title(t,e='LEARNING DESK'){$('#pageTitle').textContent=t;$('#eyebrow').textContent=e}
function nav(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function counts(){let a={new:0,learning:0,mastered:0,total:words.length};words.forEach(w=>a[st(w.word).stage]++);return a}
function streak(){let out=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10),done=(state.history[k]?.screened||0)+(state.history[k]?.studied||0)>0;out.push({label:`${d.getMonth()+1}/${d.getDate()}`,done})}return out}
function dashboard(){title('学习总览');let c=counts(),h=state.history[todayKey()]||{},pct=Math.round(c.mastered/c.total*100)||0;app.innerHTML=`
 <div class="grid stats"><div class="card"><div class="stat-label">词库总量</div><div class="stat-num">${c.total}</div><div class="stat-note">2010-2025 英语（二）真题</div></div><div class="card"><div class="stat-label">待筛查</div><div class="stat-num">${c.new}</div><div class="stat-note">第一轮快速判断</div></div><div class="card"><div class="stat-label">正在学习</div><div class="stat-num">${c.learning}</div><div class="stat-note">已进入20天计划</div></div><div class="card"><div class="stat-label">已确信掌握</div><div class="stat-num">${c.mastered}</div><div class="progress"><i style="width:${pct}%"></i></div></div></div>
 <div class="section-title"><h2>现在继续</h2></div><div class="hero"><div class="card hero-main"><p>${c.new?'先完成第一轮快速筛查。只有你明确点击“确信会”，单词才会退出后续学习；其余单词自动进入第二轮。':'第一轮筛查已完成。现在按每日计划进行混合训练，系统会优先安排错词和到期复习词。'}</p><button class="btn" id="continueBtn">${c.new?'继续筛查':'开始今日学习'} →</button></div><div class="card today-plan"><div><div class="stat-label">今日完成</div><div class="stat-num">${h.studied||0}</div><div class="stat-note">筛查 ${h.screened||0} · 答对 ${h.correct||0}</div></div><div class="ring" style="--pct:${Math.min(100,(h.studied||0)/(state.settings.sessionSize||30)*100)}%"><strong>${Math.min(100,Math.round((h.studied||0)/(state.settings.sessionSize||30)*100))}%</strong></div></div></div>
 <div class="section-title"><h2>近7天记录</h2></div><div class="card streak">${streak().map(x=>`<div class="daydot ${x.done?'done':''}"><i></i>${x.label}</div>`).join('')}</div>`;
 $('#continueBtn').onclick=()=>nav(c.new?'screening':'daily')
}
function preparePlan(){if(state.planStart)return;let learning=shuffle(words.filter(w=>st(w.word).stage==='learning'));learning.forEach((w,i)=>setst(w.word,{planSlot:i%20,strength:0,due:null,last:null}));state.planStart=todayKey();save()}
function screening(){title('第一轮 · 个人筛查','STAGE 01 · PERSONAL SCREENING');if(!state.screenOrder?.length){state.screenOrder=shuffle(words.map(w=>w.word));save()}let pending=state.screenOrder.map(x=>words.find(w=>w.word===x)).filter(w=>w&&st(w.word).stage==='new');if(!pending.length){preparePlan();app.innerHTML=`<div class="card empty"><h2>个人筛查完成</h2><p>你不会或不确定的词，已经完全随机分散到20天记忆计划中。</p><button class="btn primary" id="goDaily">开始第1天学习</button></div>`;$('#goDaily').onclick=()=>nav('daily');return}let w=pending[0],done=words.length-pending.length;app.innerHTML=`<div class="study"><div class="study-meta"><span>已判断 ${done} / ${words.length}</span><span>只把“百分之百会”的词标为会</span></div><div class="progress"><i style="width:${done/words.length*100}%"></i></div><div class="card word-card"><div class="word">${esc(w.word)}</div><div class="pos">${esc(w.pos)}</div><div class="meaning masked" id="screenMeaning">${esc(w.meaning)}</div><div class="hint">先在脑中回忆；需要时点击卡片查看释义</div></div><div class="actions"><button class="btn unsure" id="unsure">不会 / 不确定</button><button class="btn sure" id="sure">确信会</button></div></div>`;
 $('.word-card').onclick=()=>$('#screenMeaning').classList.toggle('masked');$('#sure').onclick=e=>{e.stopPropagation();setst(w.word,{stage:'mastered',last:todayKey()});addHistory('screened');screening()};$('#unsure').onclick=e=>{e.stopPropagation();let n=words.filter(x=>st(x.word).stage==='learning').length;setst(w.word,{stage:'learning',due:null,last:null,planSlot:n%state.planDays});addHistory('screened');screening()}
}
function planDay(){return state.planStart?Math.max(1,Math.floor((new Date(todayKey())-new Date(state.planStart))/86400000)+1):1}
function dueWords(){let learning=words.filter(w=>st(w.word).stage==='learning'),day=Math.min(20,planDay()),due=learning.filter(w=>st(w.word).last&&st(w.word).due<=todayKey()),scheduled=learning.filter(w=>!st(w.word).last&&(st(w.word).planSlot??0)<day),limit=Math.max(state.settings.sessionSize,Math.ceil(learning.length/20));return shuffle([...new Map([...due,...scheduled].map(w=>[w.word,w])).values()]).slice(0,limit)}
function makeSession(source){session={items:source.length?source:dueWords(),i:0,answered:false,modeIndex:0};showQuestion()}
const modes=['看词选义','看义选词','情境联想','自我回忆'];
function daily(){title(`第 ${Math.min(20,planDay())} 天 · 个性化记忆`,'STAGE 02 · 20-DAY MASTERY');let source=dueWords();app.innerHTML=`<div class="study"><div class="study-meta"><span>20天计划 · Day ${Math.min(20,planDay())}</span><span>错词提前，熟词逐渐拉开间隔</span></div><div class="mode-tabs">${modes.map((m,i)=>`<button data-mode="${i}" class="${i===0?'active':''}">${m}</button>`).join('')}</div><div id="quiz"></div></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{session={items:source,i:0,answered:false,modeIndex:+b.dataset.mode};document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));showQuestion()});makeSession(source)}
function distractors(w,key){return shuffle(words.filter(x=>x.word!==w.word&&st(x.word).stage!=='new')).slice(0,3).concat(w).sort(()=>Math.random()-.5).map(x=>key==='meaning'?{label:cleanMeaning(x.meaning),ok:x.word===w.word}:{label:x.word,ok:x.word===w.word})}
function contextFor(w){let p=w.pos||'';if(p.includes('adv'))return `The situation changed <b>${w.word}</b> after the new evidence appeared.`;if(p.includes('a'))return `The researchers described the result as <b>${w.word}</b>.`;if(p.includes('v'))return `The new policy may <b>${w.word}</b> the way people make decisions.`;return `The article discusses the role of <b>${w.word}</b> in modern society.`}
function showQuestion(){let q=$('#quiz');if(!q)return;if(!session.items.length){q.innerHTML=`<div class="card empty"><h2>今天暂时没有到期单词</h2><p>你可以去复习队列进行额外练习，或继续完成第一轮筛查。</p><button class="btn secondary" id="extra">从学习词中随机练30个</button></div>`;$('#extra').onclick=()=>makeSession(shuffle(words.filter(w=>st(w.word).stage==='learning')).slice(0,30));return}if(session.i>=session.items.length){q.innerHTML=`<div class="card empty"><h2>今日这一组完成</h2><p>学习记录已保存。错词会更早再次出现。</p><button class="btn primary" id="backDash">返回总览</button></div>`;$('#backDash').onclick=()=>nav('dashboard');return}let w=session.items[session.i],mode=session.modeIndex%4,body='';if(mode===0)body=`<div class="word">${w.word}</div><div class="pos">${esc(w.pos)}</div><div class="options">${distractors(w,'meaning').map((o,i)=>`<button class="option" data-ok="${o.ok}">${esc(o.label)}</button>`).join('')}</div>`;if(mode===1)body=`<div class="meaning">${esc(cleanMeaning(w.meaning))}</div><div class="options">${distractors(w,'word').map(o=>`<button class="option" data-ok="${o.ok}">${esc(o.label)}</button>`).join('')}</div>`;if(mode===2)body=`<div class="context">${contextFor(w)}</div><div class="hint">先根据句中位置和词形联想，再揭晓中文义</div><button class="btn secondary" id="reveal">查看释义</button><div class="meaning masked" id="revealMeaning">${esc(w.meaning)}</div><div class="actions"><button class="btn unsure self" data-ok="false">没想起来</button><button class="btn sure self" data-ok="true">想起来了</button></div>`;if(mode===3)body=`<div class="word">${w.word}</div><div class="hint">在心里说出词义，然后点击揭晓</div><button class="btn secondary" id="reveal">揭晓释义</button><div class="meaning masked" id="revealMeaning">${esc(w.meaning)}</div><div class="actions"><button class="btn unsure self" data-ok="false">不认识</button><button class="btn sure self" data-ok="true">认识</button></div>`;q.innerHTML=`<div class="study-meta"><span>${session.i+1} / ${session.items.length}</span><span>${modes[mode]}</span></div><div class="progress"><i style="width:${session.i/session.items.length*100}%"></i></div><div class="card word-card">${body}</div>`;if($('#reveal'))$('#reveal').onclick=()=>$('#revealMeaning').classList.remove('masked');document.querySelectorAll('.option,.self').forEach(b=>b.onclick=()=>answer(w,b.dataset.ok==='true',b))}
function answer(w,ok,btn){if(session.answered)return;session.answered=true;let s=st(w.word),correct=s.correct+(ok?1:0),wrong=s.wrong+(ok?0:1),strength=ok?Math.min(6,(s.strength||0)+1):Math.max(0,(s.strength||0)-2);let interval=ok?[1,1,2,4,7,11,16][strength]:0,d=new Date();d.setDate(d.getDate()+interval);setst(w.word,{stage:'learning',correct,wrong,strength,due:d.toISOString().slice(0,10),last:todayKey()});addHistory('studied');if(ok)addHistory('correct');if(btn)btn.classList.add(ok?'correct':'wrong');document.querySelectorAll('[data-ok="true"]').forEach(x=>x.classList.add('correct'));setTimeout(()=>{session.i++;session.answered=false;session.modeIndex=(session.modeIndex+1)%4;showQuestion()},900)}
function review(){title('复习队列');let items=shuffle(words.filter(w=>st(w.word).stage==='learning')).slice(0,state.settings.sessionSize);app.innerHTML=`<div class="card empty"><h2>${items.length?`准备复习 ${items.length} 个单词`:'目前没有学习中单词'}</h2><p>混合使用四种题型，答错的单词当天继续出现。</p>${items.length?'<button class="btn primary" id="startReview">开始复习</button>':''}</div><div class="study" id="quiz"></div>`;if(items.length)$('#startReview').onclick=()=>{$('#startReview').parentElement.remove();session={items,i:0,answered:false,modeIndex:0};showQuestion()}}
function finaltest(){title('第三阶段 · 全词库终极筛查','STAGE 03 · FINAL SCREENING');if(counts().new>0){app.innerHTML='<div class="card empty"><h2>第三阶段尚未解锁</h2><p>先完成第一阶段的1000词快速筛查，再进行全词库完全乱序测试。</p><button class="btn primary" id="goScreen">继续第一阶段</button></div>';$('#goScreen').onclick=()=>nav('screening');return}if(!state.stage3.order?.length){state.stage3={index:0,order:shuffle(words.map(w=>w.word)),passed:0};save()}let s=state.stage3;if(s.index>=s.order.length){app.innerHTML=`<div class="card empty"><h2>1000词终极筛查完成</h2><p>本轮准确 ${s.passed} 个；答错的词已经重新进入第二阶段。</p><button class="btn primary" id="restartFinal">重新打乱再测一次</button></div>`;$('#restartFinal').onclick=()=>{state.stage3={index:0,order:[],passed:0};save();finaltest()};return}let w=words.find(x=>x.word===s.order[s.index]),opts=distractors(w,'meaning');app.innerHTML=`<div class="study"><div class="study-meta"><span>${s.index+1} / 1000</span><span>全部1000词完全乱序 · 句中辨义</span></div><div class="progress"><i style="width:${s.index/10}%"></i></div><div class="card word-card"><div class="context">${contextFor(w)}</div><div class="hint">结合句中位置和单词本身，选择最准确的中文义</div><div class="options">${opts.map(o=>`<button class="option" data-ok="${o.ok}">${esc(o.label)}</button>`).join('')}</div></div></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(b.dataset.done)return;document.querySelectorAll('.option').forEach(x=>x.dataset.done='1');let ok=b.dataset.ok==='true';b.classList.add(ok?'correct':'wrong');document.querySelectorAll('[data-ok="true"]').forEach(x=>x.classList.add('correct'));if(ok)s.passed++;else setst(w.word,{stage:'learning',due:todayKey(),last:todayKey(),wrong:st(w.word).wrong+1});s.index++;save();setTimeout(finaltest,850)})}
function finaltest(){title('第三阶段 · 1000词终极总考','STAGE 03 · FINAL 1000');if(counts().new>0){app.innerHTML='<div class="card empty"><h2>第三阶段尚未解锁</h2><p>请先完成第一阶段的个人筛查。</p><button class="btn primary" id="goScreen">继续筛查</button></div>';$('#goScreen').onclick=()=>nav('screening');return}let remain=Math.max(0,21-planDay());if(remain>0){app.innerHTML=`<div class="card empty"><h2>第20天后解锁</h2><p>你正在第二阶段。还需完成 ${remain} 天的间隔记忆，之后1000个词会全部重新出现。</p><button class="btn primary" id="goDaily">进入今天的学习</button></div>`;$('#goDaily').onclick=()=>nav('daily');return}if(!state.stage3.order?.length){state.stage3={index:0,order:shuffle(words.map(w=>w.word)),passed:0,wrong:0,totalMs:0,questionAt:Date.now()};save()}let s=state.stage3;if(s.index>=s.order.length){let avg=s.passed?Math.round(s.totalMs/s.passed/100)/10:0;app.innerHTML=`<div class="card empty"><h2>1000词终极总考完成</h2><p>答对 ${s.passed} · 答错 ${s.wrong} · 正确题平均反应 ${avg} 秒。答错和反应超过5秒的词已回到强化队列。</p><button class="btn primary" id="restartFinal">重新乱序再考一次</button></div>`;$('#restartFinal').onclick=()=>{state.stage3={index:0,order:[],passed:0,wrong:0,totalMs:0,questionAt:0};save();finaltest()};return}let w=words.find(x=>x.word===s.order[s.index]),mode=s.index%3,opts,body;if(mode===0){opts=distractors(w,'meaning');body=`<div class="word">${esc(w.word)}</div><div class="hint">看到英文，立即选择中文义</div>`}else if(mode===1){opts=distractors(w,'meaning');body=`<div class="context">${contextFor(w)}</div><div class="hint">结合陌生句子判断加粗词义</div>`}else{opts=distractors(w,'word');body=`<div class="meaning">${esc(cleanMeaning(w.meaning))}</div><div class="hint">根据中文反向辨认英文</div>`}s.questionAt=Date.now();app.innerHTML=`<div class="study"><div class="study-meta"><span>${s.index+1} / 1000</span><span>全词库乱序 · ${['瞬时辨义','句中辨义','中文辨词'][mode]}</span></div><div class="progress"><i style="width:${s.index/10}%"></i></div><div class="card word-card">${body}<div class="options">${opts.map(o=>`<button class="option" data-ok="${o.ok}">${esc(o.label)}</button>`).join('')}</div></div></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(b.dataset.done)return;let ms=Date.now()-s.questionAt,ok=b.dataset.ok==='true',stable=ok&&ms<=5000;document.querySelectorAll('.option').forEach(x=>x.dataset.done='1');b.classList.add(ok?'correct':'wrong');document.querySelectorAll('[data-ok="true"]').forEach(x=>x.classList.add('correct'));if(ok){s.passed++;s.totalMs+=ms}else s.wrong++;if(!stable){let old=st(w.word);setst(w.word,{stage:'learning',strength:Math.max(0,(old.strength||0)-2),due:todayKey(),last:todayKey(),wrong:old.wrong+(ok?0:1)})}s.index++;save();setTimeout(finaltest,800)})}
function library(){title('全部单词');let c=counts();app.innerHTML=`<div class="toolbar"><input id="search" placeholder="搜索单词或中文义"><select id="filter" class="field"><option value="all">全部 ${c.total}</option><option value="new">待筛查 ${c.new}</option><option value="learning">第二阶段 ${c.learning}</option><option value="mastered">第一阶段会 ${c.mastered}</option></select></div><div class="table-wrap"><table><thead><tr><th>单词</th><th>词性</th><th>中文义</th><th>状态</th><th>正确 / 错误</th></tr></thead><tbody id="wordRows"></tbody></table></div>`;let draw=()=>{let q=$('#search').value.toLowerCase(),f=$('#filter').value;$('#wordRows').innerHTML=words.filter(w=>(f==='all'||st(w.word).stage===f)&&(w.word.includes(q)||w.meaning.includes(q))).map(w=>{let s=st(w.word),label={new:'待筛查',learning:'强化中',mastered:'第一阶段会'}[s.stage];return `<tr><td><b>${w.word}</b></td><td>${esc(w.pos)}</td><td>${esc(w.meaning)}</td><td><span class="tag ${s.stage}">${label}</span></td><td>${s.correct} / ${s.wrong}</td></tr>`}).join('')};$('#search').oninput=draw;$('#filter').onchange=draw;draw()}
function settings(){title('设置与备份');app.innerHTML=`<div class="settings card"><div class="setting-row"><div><b>学习计划天数</b><p>第二轮单词的基础分配周期</p></div><input id="days" class="field" type="number" min="10" max="60" value="${state.planDays}"></div><div class="setting-row"><div><b>每日练习量</b><p>今日学习与额外复习每组题数</p></div><input id="size" class="field" type="number" min="10" max="100" value="${state.settings.sessionSize}"></div><div class="setting-row"><div><b>学习记录备份</b><p>记录实时同步到云端，也可以手动导出副本</p></div><div><button class="btn secondary" id="export">导出记录</button> <label class="btn ghost">导入记录<input id="import" type="file" accept="application/json" hidden></label></div></div><div class="setting-row"><div><b>重新开始</b><p>仅清空当前账号的学习进度，不影响其他用户</p></div><button class="btn danger" id="reset">清空数据</button></div><div class="modal-note">当前登录账号：${esc(currentUser?.username||'')}。所有记录均实时同步；双方可在“双人进度”和“双人错题本”中互相查看。</div></div>`;$('#days').onchange=e=>{state.planDays=Math.max(10,Math.min(60,+e.target.value));save();toast('计划天数已更新')};$('#size').onchange=e=>{state.settings.sessionSize=Math.max(10,Math.min(100,+e.target.value));save();toast('每日练习量已更新')};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`词序_${currentUser.username}_${todayKey()}.json`;a.click();URL.revokeObjectURL(a.href)};$('#import').onchange=e=>{let r=new FileReader();r.onload=()=>{try{state={...defaults(),...JSON.parse(r.result)};save();toast('学习记录已恢复');setTimeout(()=>nav('dashboard'),600)}catch{toast('文件格式不正确')}};r.readAsText(e.target.files[0])};$('#reset').onclick=()=>{if(confirm('确定清空当前账号的全部学习记录吗？')){state=defaults();save();nav('dashboard')}}}

function publicCounts(p={}){let a={new:words.length,learning:0,mastered:0,wrongWords:0,wrongTotal:0},s=p.status||{};Object.values(s).forEach(x=>{if(x.stage&&a[x.stage]!==undefined){a.new--;a[x.stage]++}if((x.wrong||0)>0){a.wrongWords++;a.wrongTotal+=x.wrong}});return a}
async function getPublic(){let r=await fetch('/api/public');if(!r.ok)throw new Error('共享记录读取失败');return await r.json()}
async function shared(){title('K × Coral · 双人进度','SHARED PROGRESS');app.innerHTML='<div class="card empty">正在读取云端记录…</div>';try{let rows=await getPublic(),map=Object.fromEntries(rows.map(x=>[x.profile_name,x])),cards=['K','Coral'].map(n=>{let p=map[n]?.progress||{},c=publicCounts(p),h=p.history?.[todayKey()]||{},day=p.planStart?Math.min(20,Math.max(1,Math.floor((new Date(todayKey())-new Date(p.planStart))/86400000)+1)):0;return `<div class="card compare-card compare-${n.toLowerCase()}"><h2>${n}<small>${day?'20天计划 Day '+day:'尚未开始计划'}</small></h2><div class="mini-stats"><div><b>${words.length-c.new}</b><span>已筛查</span></div><div><b>${c.learning}</b><span>强化中</span></div><div><b>${c.wrongWords}</b><span>错词</span></div></div><p>今天：筛查 ${h.screened||0} · 学习 ${h.studied||0} · 答对 ${h.correct||0}</p><p class="sync-note">最近同步：${map[n]?.updated_at?new Date(map[n].updated_at).toLocaleString('zh-CN'):'暂无'}</p></div>`}).join('');let dates=[...new Set(rows.flatMap(r=>Object.keys(r.progress?.history||{})))].sort().reverse().slice(0,30);let trs=dates.map(d=>{let k=map.K?.progress?.history?.[d]||{},c=map.Coral?.progress?.history?.[d]||{};return `<tr><td>${d}</td><td>${k.screened||0} / ${k.studied||0} / ${k.correct||0}</td><td>${c.screened||0} / ${c.studied||0} / ${c.correct||0}</td></tr>`}).join('');app.innerHTML=`<div class="compare-grid">${cards}</div><div class="section-title"><h2>每日学习记录</h2><small>筛查 / 学习 / 答对</small></div><div class="card history-table"><table><thead><tr><th>日期</th><th>K</th><th>Coral</th></tr></thead><tbody>${trs||'<tr><td colspan="3">还没有学习记录</td></tr>'}</tbody></table></div>`}catch(e){app.innerHTML=`<div class="card empty"><h2>暂时无法读取</h2><p>${esc(e.message)}</p></div>`}}
async function wrongbook(){title('双人错题本','SHARED MISTAKE BOOK');app.innerHTML='<div class="card empty">正在读取错题…</div>';try{let rows=await getPublic(),map=Object.fromEntries(rows.map(x=>[x.profile_name,x]));let draw=n=>{let p=map[n]?.progress||{},items=Object.entries(p.status||{}).filter(([,s])=>(s.wrong||0)>0).sort((a,b)=>(b[1].wrong||0)-(a[1].wrong||0));app.innerHTML=`<div class="profile-tabs"><button class="btn ${n==='K'?'active':''}" data-who="K">K 的错题</button><button class="btn ${n==='Coral'?'active':''}" data-who="Coral">Coral 的错题</button></div><div class="table-wrap"><table><thead><tr><th>单词</th><th>中文义</th><th>错误次数</th><th>正确次数</th><th>最近复习</th></tr></thead><tbody>${items.map(([id,s])=>{let w=words.find(x=>x.word===id)||{word:id,meaning:''};return `<tr><td><b>${esc(w.word)}</b></td><td>${esc(w.meaning)}</td><td><b>${s.wrong||0}</b></td><td>${s.correct||0}</td><td>${s.last||'—'}</td></tr>`}).join('')||'<tr><td colspan="5">目前没有错题</td></tr>'}</tbody></table></div>`;document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>draw(b.dataset.who))};draw(currentUser?.username||'K')}catch(e){app.innerHTML=`<div class="card empty"><h2>暂时无法读取</h2><p>${esc(e.message)}</p></div>`}}

function render(){({dashboard,shared,screening,daily,review,finaltest,wrongbook,library,settings}[view]||dashboard)()}
let authMode='login';
function setAuthMode(mode){authMode=mode;$('#authTitle').textContent=mode==='login'?'登录词序':'创建学习账号';$('#authSub').textContent=mode==='login'?'继续你上次的学习进度':'不需要手机号或验证码';$('#authSubmit').textContent=mode==='login'?'登录':'注册并开始';$('#authSwitch').textContent=mode==='login'?'没有账号？立即注册':'已有账号？返回登录';$('#authError').textContent='';$('#password').autocomplete=mode==='login'?'current-password':'new-password'}
async function authSubmit(){let username=$('#username').value.trim(),password=$('#password').value;$('#authError').textContent='';$('#authSubmit').disabled=true;try{let r=await fetch(`/api/${authMode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}),d=await r.json();if(!r.ok)throw new Error(d.error||'操作失败');currentUser=d.user;await enterAccount()}catch(e){$('#authError').textContent=e.message}finally{$('#authSubmit').disabled=false}}
async function enterAccount(){let local=loadCache();try{let r=await fetch('/api/progress');if(r.ok){let d=await r.json();state=Object.keys(d.data||{}).length?{...defaults(),...d.data}:local}else state=local}catch{state=local}$('#currentUser').textContent=currentUser.username;$('#auth').classList.add('hidden');render()}
async function bootstrap(){words=window.WORDS||[];$('#today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());try{let r=await fetch('/api/me');if(r.ok){let d=await r.json();currentUser=d.user;await enterAccount()}}catch{} }
let chosenProfile=null;document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{chosenProfile=b.dataset.profile;document.querySelectorAll('[data-profile]').forEach(x=>x.classList.toggle('selected',x===b));$('#pinName').textContent=chosenProfile;$('#pinArea').classList.remove('hidden');$('#pinInput').focus()});async function profileLogin(){if(!chosenProfile)return;$('#authError').textContent='';$('#profileEnter').disabled=true;try{let r=await fetch('/api/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:chosenProfile,pin:$('#pinInput').value})}),d=await r.json();if(!r.ok)throw new Error(d.error||'无法进入');currentUser=d.user;await enterAccount()}catch(e){$('#authError').textContent=e.message}finally{$('#profileEnter').disabled=false}}$('#profileEnter').onclick=profileLogin;$('#pinInput').onkeydown=e=>{if(e.key==='Enter')profileLogin()};$('#logoutBtn').onclick=async()=>{await fetch('/api/logout',{method:'POST'}).catch(()=>{});currentUser=null;state=defaults();$('#auth').classList.remove('hidden');$('#pinInput').value=''};bootstrap();

</script>
</body>
