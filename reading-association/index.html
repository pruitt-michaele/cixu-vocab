.recall-input{width:100%;padding:15px;border:1px solid var(--line);border-radius:9px;background:white;font-size:15px}.recall-tags{min-height:36px;margin:15px 0}.recall-tags span{display:inline-block;margin:0 7px 7px 0;padding:5px 9px;background:#e5efe8;border-radius:6px;color:#32624b;font:13px Georgia,serif}.feedback{min-height:26px;color:var(--wine);font-size:13px}.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.quiz-options button{padding:18px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--ink)}.quiz-options button.correct{border-color:#76a387;background:#e2efe6}.quiz-options button.wrong{border-color:#c88686;background:#f5e3df}.quiz-word{font:clamp(33px,4vw,54px) Georgia,serif;color:var(--wine);overflow-wrap:anywhere;margin:25px 0}.progress-list{display:grid;gap:9px}.progress-list button{padding:12px 14px;border:1px solid var(--line);background:var(--paper);border-radius:8px;text-align:left;display:flex;justify-content:space-between}.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none!important}.mobile-nav{display:none}.spacer{margin-top:14px}.notice{font-size:12px;color:var(--muted);line-height:1.8}.danger{color:#9a4141}#toast{position:fixed;right:20px;bottom:20px;background:#30252a;color:white;padding:12px 18px;border-radius:9px;z-index:10;box-shadow:0 10px 30px #0002;display:none}.source{margin-top:35px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:11px;line-height:1.7}

<script>const DATA=[{"id":1,"label":"消失","words":["disappear","vanish","evaporate"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":2,"label":"重要","words":["essential","vital","important","significant","crucial","critical","indispensable","necessary","principal","matter","count much","central","integral"],"note":"essential / vital / crucial 偏“不可缺”；significant 偏“有意义”；principal 偏“主要”；matter、count much 是动词表达。"},{"id":3,"label":"保持坚持维持","words":["retain","maintain","sustain","remain","keep","stay","hold","stick","insist","persist","persevere","preserve"],"note":"retain / preserve 偏“保留”；maintain / sustain 偏“维持”；insist / persist / persevere 偏“坚持”。"},{"id":4,"label":"特征特点","words":["trait","characteristic","feature"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":5,"label":"吸引","words":["tempt","appeal","lure","attract","draw","suck","absorb"],"note":"attract / draw / appeal to 偏“吸引”；tempt / lure 偏“诱使”；absorb 偏“使全神贯注”；suck 常有“吸入”义。"},{"id":6,"label":"名声声望","words":["fame","reputation","rap","renown","prestige"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":7,"label":"争议","words":["dispute","controversy","debate"],"note":"controversy 是名词；dispute、debate 兼有名词或动词用法。"},{"id":8,"label":"导致引发","words":["cause","arouse","raise","trigger","spur","spark","lead to","contribute to","result in","give rise to","bring about"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":9,"label":"源于","words":["stem from","originate from","come from","result from","derive from"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":10,"label":"分配","words":["allocate","distribute"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":11,"label":"限制、抑制","words":["restrict","restrain","resist","constrain","confine","condition","cap","limit","scale back","check","curb","inhibit","suppress"],"note":"restrict / constrain / limit 偏限制；curb / inhibit / suppress 偏遏制；resist 是“抵抗”。"},{"id":12,"label":"授予、给","words":["grant","give","authorize"],"note":"grant 可指正式授予；authorize 是“授权”，不能直接代换 give。"},{"id":13,"label":"裁决","words":["rule","judge","verdict"] const KEY='reading-association-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{};const state={page:'home',id:1,revealed:false,found:[],filter:'all',query:'',quiz:null,answered:false};const navs=[['home','总览','◉'],['learn','联想卡','◇'],['recall','默写','✎'],['quiz','辨义','◎'],['atlas','词义图谱','▦'],['progress','进度','↗']];const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const item=id=>DATA.find(g=>g.id===id)||DATA[0];const record=id=>saved[id]||{level:0,due:0,seen:0};function persist(){localStorage.setItem(KEY,JSON.stringify(saved))}function today(){return new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}function toast(s){let n=$('#toast');n.textContent=s;n.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>n.style.display='none',2600)}function status(g){let r=record(g.id);return r.level>=3?'熟悉':r.level>0?'学习中':r.seen?'待巩固':'未开始'}function due(g){let r=record(g.id);return r.seen && r.due<=Date.now()}
function setPage(page,id){state.page=page;if(id)state.id=id;state.revealed=false;state.found=[];state.answered=false;render();window.scrollTo({top:0,behavior:'smooth'})}function navHtml(mobile=false){return navs.map(([p,n,ic])=>`<button class="${state.page===p?'active':''}" data-nav="${p}" aria-label="${n}">${mobile?ic+'<br>':''}${mobile?n:`<span>${ic}</span>${n}`}</button>`).join('')}function render(){ $('#nav').innerHTML=navHtml();$('#mobileNav').innerHTML=navHtml(true);$('#date').textContent=today();$('#pageTitle').textContent=Object.fromEntries(navs.map(([a,b])=>[a,b]))[state.page];$('#view').innerHTML=({home:home,learn:learn,recall:recall,quiz:quiz,atlas:atlas,progress:progress})[state.page]();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setPage(b.dataset.nav));bind()}
function home(){let seen=DATA.filter(g=>record(g.id).seen).length, mastered=DATA.filter(g=>record(g.id).level>=3).length, dueCount=DATA.filter(due).length;return `<section class="panel hero"><div class="hero-left"><div class="ey">ONE MEANING · MANY EXPRESSIONS</div><h2>看到“重要”，<br>让整组词自己浮现。</h2><p>先建立首字母线索，再分段回忆，最后用默写和反向辨义检验。每次答完根据熟练度安排复习。</p><button class="btn light" data-go="learn">开始联想 →</button></div><div class="hero-right"><strong>173<span style="font:18px Georgia,serif"> 组</span></strong><p>共 751 个词条，来自你上传的 PDF。搜索中文或英文，随时回到薄弱词组。</p><button class="btn outline" data-go="atlas">打开词义图谱</button></div></section><section class="section grid3"><div class="panel stat"><span class="small muted">已接触词组</span><b>${seen}</b><span class="small muted">/ ${DATA.length} 组</span></div><div class="panel stat"><span class="small muted">熟悉词组</span><b>${mastered}</b><span class="small muted">至少三次正确回忆</span></div><div class="panel stat"><span class="small muted">今日待复习</span><b>${dueCount}</b><button class="btn outline spacer" data-due>开始复习</button></div></section><section class="section"><h2>三次接触，形成联想</h2><div class="steps"><div class="panel step"><i>01</i><h3>看见词义</h3><p>先看首字母骨架，尝试说出每段的单词，再翻开完整词组。</p></div><div class="panel step"><i>02</i><h3>主动默写</h3><p>从中文出发逐个输入，同一组所有表达都出现后才算完成。</p></div><div class="panel step"><i>03</i><h3>反向辨义</h3><p>给出英文选中文，避免只会顺着列表背，不会在阅读里识别。</p></div></div></section><section class="section"><h2>今天先从这些词义开始</h2><div class="atlas">${DATA.slice(0,6).map(groupCard).join('')}</div></section>`}
function skeleton(g){return g.words.map(w=>w.split(/\s+/).map(x=>x[0]?.toUpperCase()||'').join('·')).join(' · ')}function chunks(g){let n=g.words.length>18?6:g.words.length>9?4:Math.min(4,Math.max(2,Math.ceil(g.words.length/2)));let arr=[];for(let i=0;i<g.words.length;i+=n)arr.push(g.words.slice(i,i+n));return arr}function chipHtml(g,mode){return chunks(g).map((part,i)=>`<div class="chunk"><label>第 ${i+1} 段 · ${part.map(w=>w[0].toUpperCase()).join(' / ')}</label><div class="chips">${part.map(w=>`<span class="chip ${mode==='hidden'?'hidden-word':mode==='recall'?(state.found.includes(w)?'found':state.revealed?'missing':'hidden-word'):''}">${esc(w)}</span>`).join('')}</div></div>`).join('')}
function controls(){let index=DATA.findIndex(g=>g.id===state.id);return `<div class="row spacer"><button class="btn outline" data-prev ${index===0?'disabled':''}>← 上一组</button><button class="btn outline" data-next ${index===DATA.length-1?'disabled':''}>下一组 →</button><button class="btn outline" data-random>随机一组</button></div>`}function side(g){let r=record(g.id);return `<div class="panel study-side"><div class="overline">LEARNING NOTES</div><h3>如何记这一组</h3><p>先读中文词义，沿着首字母逐段“报数”。看完后关掉答案，靠主动提取巩固记忆。</p><div class="small muted">当前等级 ${r.level||0} / 5</div><div class="meter spacer"><span style="width:${Math.min(100,(r.level||0)*20)}%"></span></div><p class="spacer">${r.due&&r.due>Date.now()?'下次复习：'+new Date(r.due).toLocaleDateString('zh-CN'):'现在可以复习'}</p><button class="btn outline" data-atlas>查看全部词组</button></div>`}
function learn(){let g=item(state.id),r=record(g.id);return `<div class="study-layout"><div class="panel study-main"><div class="overline">联想卡 · ${g.id} / ${DATA.length} · ${g.words.length} 个表达</div><div class="prompt">${esc(g.label)}</div><div class="subline">先试着从中文说出英文。想不起时，借助下方首字母。</div><div class="memory"><label>首字母骨架</label><strong>${esc(skeleton(g))}</strong><p>按照原稿顺序，每 2—6 个词分一段；短语用“·”标注首字母。</p></div><div class="chunks">${chipHtml(g,state.revealed?'show':'hidden')}</div>${state.revealed?`<div class="note"><b>语境提醒：</b>${esc(g.note)}</div>`:''}<div class="row spacer"><button class="btn primary" data-reveal>${state.revealed?'再次遮挡':'揭开整组'}</button><button class="btn outline" data-speak ${!state.revealed?'disabled':''}>朗读英文</button><button class="btn outline" data-recall>去默写这一组</button></div>${controls()}</div>${side(g)}</div>`}
function recall(){let g=item(state.id),n=state.found.length;return `<div class="study-layout"><div class="panel study-main"><div class="overline">主动提取 · ${g.id} / ${DATA.length}</div><div class="prompt">${esc(g.label)}</div><div class="subline">输入一个英文词或短语后按 Enter。顺序不限，拼写与空格需准确。<br>已想起 <b>${n} / ${g.words.length}</b> 个。</div><div class="memory"><label>需要提示时再看</label><strong>${state.revealed?esc(skeleton(g)):'••• 首字母骨架已遮挡'}</strong><button class="btn outline spacer" data-hint>切换提示</button></div><input class="recall-input" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入想起的单词或短语" aria-label="输入英文词条"><div class="recall-tags">${state.found.map(w=>`<span>${esc(w)}</span>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="chunks">${chipHtml(g,'recall')}</div><div class="row spacer"><button class="btn primary" data-check>核对并安排复习</button><button class="btn outline" data-speak>朗读英文</button></div>${state.answered?`<div class="note"><b>语境提醒：</b>${esc(g.note)}</div>`:''}${controls()}</div>${side(g)}</div>`}
function makeQuiz(){let g=DATA[Math.floor(Math.random()*DATA.length)],w=g.words[Math.floor(Math.random()*g.words.length)],others=DATA.filter(x=>x.id!==g.id).sort(()=>Math.random()-.5).slice(0,3);state.quiz={g,w,options:[g,...others].sort(()=>Math.random()-.5)};state.answered=false}function quiz(){if(!state.quiz)makeQuiz();let q=state.quiz;return `<div class="study-layout"><div class="panel study-main"><div class="overline">反向辨义 · 阅读识别</div><div class="subline spacer">这个词在原稿中属于哪个中文词义组？</div><div class="quiz-word">${esc(q.w)}</div><div class="quiz-options">${q.options.map(x=>`<button data-option="${x.id}" class="${state.answered?(x.id===q.g.id?'correct':x.id===state.chosen?'wrong':''):''}">${esc(x.label)}</button>`).join('')}</div>${state.answered?`<div class="note"><b>所属词组：</b>${esc(q.g.label)} · ${esc(q.g.note)}</div><button class="btn primary spacer" data-newquiz>下一题 →</button>`:''}</div><div class="panel study-side"><h3>阅读里的替换</h3><p>先从英文词汇反推中文概念。题目随机取自全部 ${DATA.length} 组；多义词按这份资料的分组判断。</p><button class="btn outline" data-newquiz>换一题</button></div></div>`}
function groupCard(g){return `<article class="panel group" role="button" tabindex="0" data-group="${g.id}" aria-label="学习${esc(g.label)}"><div class="group-head"><h3>${esc(g.label)}</h3><span class="badge">${status(g)}</span></div><p>${g.words.slice(0,4).map(esc).join(' · ')}${g.words.length>4?' …':''}</p><footer><span>${g.words.length} 个表达</span><span>打开联想卡 ↗</span></footer></article>`}function atlas(){let list=DATA.filter(g=>{let q=state.query.toLowerCase();return (!q||g.label.includes(q)||g.words.some(w=>w.toLowerCase().includes(q)))&&(state.filter==='all'||(state.filter==='due'?due(g):state.filter==='new'?!record(g.id).seen:status(g)===state.filter))});return `<div class="toolbar"><input class="search" id="search" placeholder="搜索中文词义或英文单词" value="${esc(state.query)}" aria-label="搜索词组"><select class="filter" id="filter" aria-label="筛选词组"><option value="all">全部词组</option><option value="due" ${state.filter==='due'?'selected':''}>待复习</option><option value="new" ${state.filter==='new'?'selected':''}>未接触</option><option value="学习中" ${state.filter==='学习中'?'selected':''}>学习中</option><option value="熟悉" ${state.filter==='熟悉'?'selected':''}>熟悉</option></select></div><p class="small muted">显示 ${list.length} / ${DATA.length} 组 · 点开卡片后可逐段联想和默写</p><div class="atlas" id="results">${list.map(groupCard).join('')||'<div class="panel empty">没有符合条件的词组</div>'}</div>`}function refreshAtlas(){let box=$('#results');if(!box)return;let q=state.query.toLowerCase();let list=DATA.filter(g=>(!q||g.label.includes(q)||g.words.some(w=>w.toLowerCase().includes(q)))&&(state.filter==='all'||(state.filter==='due'?due(g):state.filter==='new'?!record(g.id).seen:status(g)===state.filter)));box.innerHTML=list.map(groupCard).join('')||'<div class="panel empty">没有符合条件的词组</div>';$('.small.muted').textContent=`显示 ${list.length} / ${DATA.length} 组 · 点开卡片后可逐段联想和默写`;bindGroups()}
function progress(){let learned=DATA.filter(g=>record(g.id).seen), dueList=DATA.filter(due),mastered=learned.filter(g=>record(g.id).level>=3);return `<div class="grid3"><div class="panel stat"><span class="small muted">已接触</span><b>${learned.length}</b></div><div class="panel stat"><span class="small muted">熟悉</span><b>${mastered.length}</b></div><div class="panel stat"><span class="small muted">待复习</span><b>${dueList.length}</b></div></div><section class="section"><h2>待复习词组</h2><div class="progress-list">${dueList.slice(0,30).map(g=>`<button data-review="${g.id}"><span>${esc(g.label)}</span><span class="muted">${record(g.id).level} / 5 →</span></button>`).join('')||'<div class="panel empty">暂无到期词组。可以打开词义图谱继续学习。</div>'}</div></section><section class="section panel" style="padding:25px"><h2>记录与备份</h2><p class="notice">记录只存在当前浏览器，不会自动同步到另一台手机或电脑。定期导出备份，换设备时导入即可。</p><div class="row"><button class="btn outline" data-export>导出进度 JSON</button><label class="btn outline" style="cursor:pointer">导入进度 JSON<input type="file" id="import" accept="application/json,.json" hidden></label><button class="btn outline danger" data-reset>清空本机进度</button></div></section>`}
function bindGroups(){document.querySelectorAll('[data-group]').forEach(el=>{el.onclick=()=>setPage('learn',+el.dataset.group);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}})}function next(dir){let i=DATA.findIndex(g=>g.id===state.id)+dir;if(DATA[i])setPage(state.page,DATA[i].id)}function speak(g){if(!('speechSynthesis'in window)){toast('此浏览器暂不支持语音朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(g.words.join('. '));u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function check(){let g=item(state.id),score=state.found.length/g.words.length,r=record(g.id);let level=score>=.8?Math.min(5,(r.level||0)+1):score>=.45?Math.max(1,r.level||0):0;let days=[0,1,3,7,14,30][level];saved[g.id]={level,due:Date.now()+(days?days*86400000:10*60000),seen:Date.now(),lastScore:Math.round(score*100)};persist();state.revealed=true;state.answered=true;render();toast(`想起 ${state.found.length}/${g.words.length} 个 · ${days?days+' 天后复习':'稍后再练'}`)}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>setPage(el.dataset.go));bindGroups();$('[data-due]')?.addEventListener('click',()=>{let g=DATA.find(due);if(g)setPage('recall',g.id);else toast('暂无到期词组')});$('[data-reveal]')?.addEventListener('click',()=>{let r=record(state.id);saved[state.id]={...r,seen:r.seen||Date.now()};persist();state.revealed=!state.revealed;render()});$('[data-hint]')?.addEventListener('click',()=>{state.revealed=!state.revealed;render();$('#answer')?.focus()});$('[data-recall]')?.addEventListener('click',()=>setPage('recall',state.id));$('[data-atlas]')?.addEventListener('click',()=>setPage('atlas'));$('[data-prev]')?.addEventListener('click',()=>next(-1));$('[data-next]')?.addEventListener('click',()=>next(1));$('[data-random]')?.addEventListener('click',()=>setPage(state.page,DATA[Math.floor(Math.random()*DATA.length)].id));$('[data-speak]')?.addEventListener('click',()=>speak(item(state.id)));let answer=$('#answer');if(answer){answer.focus();answer.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();let v=answer.value.trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ');let g=item(state.id),found=g.words.find(w=>w.toLowerCase().replace(/[’']/g,"'")===v);let f=$('#feedback');if(found&&!state.found.includes(found)){state.found.push(found);f.textContent='✓ 已加入：'+found;answer.value='';let tags=$('.recall-tags');tags.innerHTML=state.found.map(w=>`<span>${esc(w)}</span>`).join('');$('.subline b').textContent=`${state.found.length} / ${g.words.length}`;$('.chunks').innerHTML=chipHtml(g,'recall');if(state.found.length===g.words.length){check()}}else{f.textContent=found?'这个词已经输入过':'未匹配本组词条，可以换一个词或查看提示'}}} $('[data-check]')?.addEventListener('click',check);document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(state.answered)return;state.answered=true;state.chosen=+b.dataset.option;let g=state.quiz.g,r=record(g.id),ok=state.chosen===g.id;saved[g.id]={level:ok?Math.min(5,(r.level||0)+1):Math.max(0,(r.level||0)-1),due:Date.now()+(ok?86400000:600000),seen:Date.now()};persist();render();toast(ok?'判断正确':'再看一遍所属词组')});document.querySelectorAll('[data-newquiz]').forEach(b=>b.onclick=()=>{makeQuiz();render()});let search=$('#search');if(search)search.oninput=e=>{state.query=e.target.value;refreshAtlas()};let filter=$('#filter');if(filter)filter.onchange=e=>{state.filter=e.target.value;refreshAtlas()};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>setPage('recall',+b.dataset.review));$('[data-export]')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify({app:'reading-association-v1',exported:new Date().toISOString(),records:saved},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='词义联想室-学习进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});let imp=$('#import');if(imp)imp.onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(v.app!=='reading-association-v1'||typeof v.records!=='object'||!v.records)throw Error();saved=v.records;persist();render();toast('进度已导入')}catch{toast('文件格式不正确')}};$('[data-reset]')?.addEventListener('click',()=>{if(confirm('确定清空这台设备的所有学习进度吗？此操作无法撤销。')){saved={};persist();render();toast('已清空本机进度')}})}render();</script></body></html>
