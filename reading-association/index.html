<script>const DATA=[{"id":1,"label":"消失","words":["disappear","vanish","evaporate"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":2,"label":"重要","words":["essential","vital","important","significant","crucial","critical","indispensable","necessary","principal","matter","count much","central","integral"],"note":"essential / vital / crucial 偏“不可缺”；significant 偏“有意义”；principal 偏“主要”；matter、count much 是动词表达。"},{"id":3,"label":"保持坚持维持","words":["retain","maintain","sustain","remain","keep","stay","hold","stick","insist","persist","persevere","preserve"],"note":"retain / preserve 偏“保留”；maintain / sustain 偏“维持”；insist / persist / persevere 偏“坚持”。"},{"id":4,"label":"特征特点","words":["trait","characteristic","feature"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":5,"label":"吸引","words":["tempt","appeal","lure","attract","draw","suck","absorb"],"note":"attract / draw / appeal to 偏“吸引”；tempt / lure 偏“诱使”；absorb 偏“使全神贯注”；suck 常有“吸入”义。"},{"id":6,"label":"名声声望","words":["fame","reputation","rap","renown","prestige"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":7,"label":"争议","words":["dispute","controversy","debate"],"note":"controversy 是名词；dispute、debate 兼有名词或动词用法。"},{"id":8,"label":"导致引发","words":["cause","arouse","raise","trigger","spur","spark","lead to","contribute to","result in","give rise to","bring about"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":9,"label":"源于","words":["stem from","originate from","come from","result from","derive from"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":10,"label":"分配","words":["allocate","distribute"],"note":"同组词用于阅读识别；实际写作需核对词性、搭配和语境。"},{"id":11,"label":"限制、抑制","words":["restrict","restrain","resist","constrain","confine","condition","cap","limit","scale back","check","curb","inhibit","suppress"],"note":"restrict / constrain / limit 偏限制；curb / inhibit / suppress 偏遏制；resist 是“抵抗”。"},{"id":12,"label":"授予、给","words":["grant","give","authorize"],"note":"grant 可指正式授予；authorize 是“授权”，不能直接代换 give。"},{"id":13,"label":"裁决","words":["rule","judge","verdict"] const KEY='reading-association-v1', WORD_KEY='reading-recognition-v2';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readStore(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
let legacy=readStore(KEY,{}), db=readStore(WORD_KEY,{words:{},sessions:[]});
db.words=db.words||{};db.sessions=db.sessions||[];
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").trim().replace(/\s+/g,' ');
function day(t=Date.now()){let p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(t));let v=k=>p.find(x=>x.type===k).value;return `${v('year')}-${v('month')}-${v('day')}`}
function write(){try{localStorage.setItem(WORD_KEY,JSON.stringify(db))}catch{toast('浏览器未能保存进度，请导出备份')}}
const lexicon=[];for(const g of DATA)for(const w of g.words){let key=norm(w),exists=lexicon.find(x=>x.key===key);if(exists)exists.groups.push(g.id);else lexicon.push({key,w,gid:g.id,groups:[g.id]})}
for(const g of DATA){let old=legacy[g.id];if(old?.seen)for(const w of g.words){let key=norm(w);if(!db.words[key])db.words[key]={days:[day(old.seen)],first:old.seen,last:old.seen,streak:0,correct:0,wrong:0,due:0}}}write();

const navs=[['home','今日工作台','◉'],['learn','联想卡','◇'],['quiz','识词测试','◎'],['atlas','词义图谱','▦'],['progress','学习记录','↗']];
const state={page:'home',id:1,filter:'all',query:'',date:day(),mode:'word',scope:'date',round:null};
const group=id=>DATA.find(g=>g.id===id)||DATA[0], wr=x=>db.words[typeof x==='string'?x:x.key];
function learned(){return lexicon.filter(x=>wr(x))}function todayWords(){return learned().filter(x=>wr(x).days.includes(day()))}function dueWords(){return learned().filter(x=>(wr(x).due||0)<=Date.now())}
function markWord(w){let k=norm(w),r=db.words[k];if(!r)r=db.words[k]={days:[],first:Date.now(),streak:0,correct:0,wrong:0,due:0};if(!r.days.includes(day()))r.days.push(day());r.last=Date.now();write()}
function markGroup(g){g.words.forEach(markWord)}
function status(g){let arr=g.words.map(w=>wr(norm(w))).filter(Boolean);return !arr.length?'未开始':arr.length===g.words.length&&arr.every(r=>(r.streak||0)>=3)?'熟悉':'学习中'}
function toast(s){let el=$('#toast');el.textContent=s;el.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>el.style.display='none',2600)}
function shuffle(arr){arr=[...arr];for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function setPage(page,id){state.page=page;if(id)state.id=id;if(page==='learn')markGroup(group(state.id));render();window.scrollTo({top:0,behavior:'smooth'})}
function navHtml(mobile=false){return navs.map(([p,n,ic])=>`<button class="${state.page===p?'active':''}" data-nav="${p}" aria-label="${n}">${mobile?ic+'<br>':''}${mobile?n:`<span>${ic}</span>${n}`}</button>`).join('')}
function render(){ $('#nav').innerHTML=navHtml();$('#mobileNav').innerHTML=navHtml(true);$('#date').textContent=new Date().toLocaleDateString('zh-CN');$('#pageTitle').textContent=navs.find(x=>x[0]===state.page)?.[1]||'今日工作台';$('#view').innerHTML=({home,learn,quiz,atlas,progress})[state.page]();bind()}
function home(){let n=todayWords().length,l=learned().length,d=dueWords().length;return `<section class="panel hero"><div class="hero-left"><div class="ey">RECOGNIZE · UNDERSTAND · READ</div><h2>看见 vital，<br>立即读懂“至关重要”。</h2><p>学习重点是认识单词、读懂句子。点词听读音，再把今天学过的词打乱，用四选一检验阅读识别。</p><div class="row"><button class="btn light" data-start="word">测试今日学过的词 →</button><button class="btn outline on-dark" data-go="learn">打开联想卡</button></div></div><div class="hero-right"><strong>${n}<span style="font:18px Georgia,serif"> 个词</span></strong><p>今天接触的词已加入今日词池。重新打开联想卡也会计入今天，方便重温旧词。</p><button class="btn outline" data-start="context">在句子中识词</button></div></section><section class="section grid3"><div class="panel stat"><span class="small muted">累计接触</span><b>${l}</b><span class="small muted">去重统计单词与短语</span></div><div class="panel stat"><span class="small muted">识别熟悉</span><b>${learned().filter(x=>(wr(x).streak||0)>=3).length}</b><span class="small muted">连续三次识词答对</span></div><div class="panel stat"><span class="small muted">到期复习</span><b>${d}</b><button class="btn outline spacer" data-due>打乱复习</button></div></section><section class="section"><h2>以阅读识别为主线</h2><div class="steps"><div class="panel step"><i>01</i><h3>中文联想 · 点词听音</h3><p>同义词组整体看，点击任意词只朗读该词。读音帮助你把拼写与概念联系起来。</p></div><div class="panel step"><i>02</i><h3>每天打乱 · 四选一</h3><p>给出英文，在四个中文选项中辨义。答错的词会进入错词复练，逐词记录掌握情况。</p></div><div class="panel step"><i>03</i><h3>放回句子 · 判断观点</h3><p>在原创短句中辨义，再用观点题练习识别肯定、怀疑、转折和限定。</p></div></div></section><section class="section"><h2>继续学习这些词义</h2><div class="atlas">${DATA.slice(0,6).map(groupCard).join('')}</div></section>`}
function chunks(g){let arr=[];for(let i=0;i<g.words.length;i+=4)arr.push(g.words.slice(i,i+4));return arr}
function wordButton(w){let r=wr(norm(w));return `<button class="chip word-audio" data-word="${esc(w)}" aria-label="朗读 ${esc(w)}"><span>${esc(w)}</span><span class="audio-icon" aria-hidden="true">◖))</span>${r&&(r.wrong||0)>0&&(r.streak||0)<3?'<span class="word-dot" title="需要巩固"></span>':''}</button>`}
function controls(){let i=DATA.findIndex(g=>g.id===state.id);return `<div class="row spacer"><button class="btn outline" data-prev ${i===0?'disabled':''}>← 上一组</button><button class="btn outline" data-next ${i===DATA.length-1?'disabled':''}>下一组 →</button><button class="btn outline" data-random>随机一组</button></div>`}
function learn(){let g=group(state.id);return `<div class="study-layout"><div class="panel study-main"><div class="overline">联想卡 · ${g.id} / ${DATA.length} · ${g.words.length} 个表达</div><div class="prompt">${esc(g.label.replace(/⻅/g,'见'))}</div><div class="subline">本组已加入今天的学习词池。点击任意单词，听它自己的读音。<br>先认识这组表达，再用四选一检验，不要求默写。</div><div class="chunks">${chunks(g).map((part,i)=>`<div class="chunk"><label>第 ${i+1} 段 · 同一概念下的表达</label><div class="chips">${part.map(wordButton).join('')}</div></div>`).join('')}</div><div class="note"><b>阅读辨析：</b>${esc(g.note.replace('请按页面中的语义分区记忆','请区分金额、收入、开支和资产等概念'))}</div><div class="row spacer"><button class="btn primary" data-group-test>四选一测试本组</button><button class="btn outline" data-speak>朗读整组</button><button class="btn outline" data-start="word">打乱今日词池</button></div>${controls()}</div><div class="panel study-side"><div class="overline">READING FIRST</div><h3>认识，比默写优先</h3><p>你的目标是看到英文就明白概念。不要把同组所有词当作可以互换的表达；词性、搭配与具体语境仍需区分。</p><p>本组词条：${g.words.length}<br>识别熟悉：${g.words.filter(w=>(wr(norm(w))?.streak||0)>=3).length}</p><button class="btn outline" data-go="atlas">打开全部词义</button></div></div>`}
function pool(){let all=state.scope==='group'?lexicon.filter(x=>x.groups.includes(state.id)):state.scope==='due'?dueWords():state.scope==='all'?learned():learned().filter(x=>wr(x).days.includes(state.date));if(state.mode==='context')return all.filter(x=>CONTEXTS.some(c=>c.key===x.key));if(state.mode==='opinion')return OPINIONS.filter(o=>all.some(x=>x.key===norm(o.word)||norm(o.word)==='feasible'&&x.key==='feasible'));return all.filter(x=>!/^[-]/.test(x.w)&&!x.w.endsWith('-')&&x.key!=='on the cliff')}
function dates(){return [...new Set(learned().flatMap(x=>wr(x).days))].sort().reverse()}
function configure(mode,scope='date'){state.mode=mode;state.scope=scope;state.date=day();state.round=null;setPage('quiz')}
function startRound(custom){let items=shuffle(custom||pool());state.round={items,index:0,correct:0,wrong:[],answered:false,chosen:null,finished:false,options:[],firstPass:items.length};if(items.length)prepareQuestion();render()}
function questionMeaning(x){return state.mode==='context'?({'decline':'拒绝','objective':'客观的','critical':'至关重要的','vital':'至关重要的','significant':'显著的','novel':'新颖的'}[x.key]||meaning(x)):meaning(x)}
function prepareQuestion(){let r=state.round,x=r.items[r.index];r.answered=false;r.chosen=null;if(state.mode==='opinion'){r.options=shuffle(x.options.map((label,i)=>({label,correct:i===x.answer})));return}let correct=questionMeaning(x),allMeanings=x.groups.map(id=>group(id).label);let excluded=new Set([correct,meaning(x),...allMeanings]);let candidates=shuffle(lexicon).map(y=>meaning(y)).filter(label=>!excluded.has(label));let distractors=[...new Set(candidates)].slice(0,3);r.options=shuffle([{label:correct,correct:true},...distractors.map(label=>({label,correct:false}))]);}
function dateToolbar(){return `<div class="toolbar"><select class="filter" id="scope" aria-label="测试词池"><option value="date" ${state.scope==='date'?'selected':''}>某天学过的词</option><option value="all" ${state.scope==='all'?'selected':''}>累计学过的词</option><option value="due" ${state.scope==='due'?'selected':''}>到期复习词</option>${state.scope==='group'?'<option value="group" selected>当前联想卡词组</option>':''}</select>${state.scope==='date'?`<select class="filter" id="study-date" aria-label="学习日期">${[...new Set([day(),...dates()])].map(d=>`<option value="${d}" ${d===state.date?'selected':''}>${d===day()?'今天 · ':''}${d}</option>`).join('')}</select>`:''}<button class="btn outline" data-restart>重新打乱</button></div><div class="mode-tabs">${[['word','单词四选一'],['context','句中辨义'],['opinion','观点判断']].map(([k,v])=>`<button class="${state.mode===k?'active':''}" data-mode="${k}">${v}</button>`).join('')}</div>`}
function highlight(sentence,word){let i=sentence.toLowerCase().indexOf(word.toLowerCase());if(i<0)return esc(sentence);return esc(sentence.slice(0,i))+`<mark>${esc(sentence.slice(i,i+word.length))}</mark>`+esc(sentence.slice(i+word.length))}
function quiz(){let r=state.round;if(!r){let p=pool();return dateToolbar()+`<div class="panel empty"><h2>${state.mode==='word'?'打乱学过的词，看看能否一眼认出':state.mode==='context'?'把词放回句子中理解':'通过词汇理解作者观点'}</h2><p>当前词池有 ${p.length} ${state.mode==='opinion'?'道观点题':'个可测试词条'}。</p><p class="notice">${state.mode==='word'?'题目逐词打乱，同一轮不会重复。无需输入英文。':state.mode==='context'?`句子为原创练习，当前提供 ${CONTEXTS.length} 个重点词语境；只测试你接触过的词。`:`原创观点练习 ${OPINIONS.length} 道；重点留意转折、否定与程度限定。`}</p>${p.length?'<button class="btn primary" data-begin>开始这一轮 →</button>':'<button class="btn primary" data-go="learn">先去联想卡学习</button>'}</div>`}if(r.finished){let total=r.items.length,accuracy=total?Math.round(r.correct/total*100):0;return dateToolbar()+`<div class="panel study-main"><div class="overline">本轮完成 · ${total} 道</div><div class="prompt">${accuracy}%</div><p class="subline">答对 ${r.correct} 道，答错 ${total-r.correct} 道。按识别结果安排下次复习。</p><div class="row"><button class="btn primary" data-restart>再打乱一轮</button>${r.wrong.length?'<button class="btn outline" data-mistakes>只复练错题</button>':''}</div>${r.wrong.length?`<div class="note"><b>这轮需要巩固：</b>${r.wrong.map(x=>esc(x.w||x.word)).join(' · ')}</div>`:'<div class="note">这一轮全部认出来了。之后再到句子里确认含义。</div>'}</div>`}let x=r.items[r.index],isOpinion=state.mode==='opinion',ctx=state.mode==='context'?CONTEXTS.find(c=>c.key===x.key):null;return dateToolbar()+`<div class="study-layout"><div class="panel study-main"><div class="overline">${isOpinion?'观点判断':ctx?'句中辨义':'单词四选一'} · ${r.index+1} / ${r.items.length}</div><div class="meter spacer"><span style="width:${r.index/r.items.length*100}%"></span></div><p class="subline spacer">${isOpinion?'根据这句话，选出最符合作者观点的一项。':ctx?'句中高亮的词或短语，最接近哪个中文含义？':'看到这个英文，选出它的中文含义。'}</p>${ctx||isOpinion?`<div class="reading-sentence">${highlight((ctx||x).sentence,ctx?ctx.word:x.word)}</div>`:`<div class="quiz-word">${esc(x.w)}</div>`}<button class="btn outline" data-quiz-audio>听${ctx||isOpinion?'整句':'这个词'}的读音</button><div class="quiz-options">${r.options.map((o,i)=>`<button data-option="${i}" ${r.answered?'disabled':''} class="${r.answered?(o.correct?'correct':r.chosen===i?'wrong':''):''}"><span class="option-letter">${'ABCD'[i]}</span>${esc(o.label)}</button>`).join('')}</div>${r.answered?`<div class="note"><b>${r.options[r.chosen].correct?'判断正确。':'本题选错了。'} </b>${isOpinion?esc(x.explain):ctx?`${esc(ctx.translation)}<br>${esc(ctx.explanation)}`:`${esc(x.w)} → ${esc(meaning(x))}<br>${esc(group(x.gid).note)}`}</div><button class="btn primary spacer" data-next-question>${r.index===r.items.length-1?'查看本轮结果':'下一题 →'}</button>`:''}</div><div class="panel study-side"><div class="overline">READING CHECK</div><h3>逐词识别，逐词复习</h3><p>今天学过的词会打乱排列。认识的词延后复习；答错的词保留在错词记录中，本轮结束后可以集中复练。</p><p>本轮答对：${r.correct}<br>本轮答错：${r.wrong.length}</p>${!isOpinion?`<button class="btn outline" data-back-group="${x.gid}">回看联想卡</button>`:''}</div></div>`}
function answerQuestion(i){let r=state.round;if(!r||r.answered||r.finished)return;let x=r.items[r.index],ok=r.options[i].correct;r.answered=true;r.chosen=i;if(ok)r.correct++;else r.wrong.push(x);if(state.mode!=='opinion'){let record=wr(x);if(record){record.correct=(record.correct||0)+(ok?1:0);record.wrong=(record.wrong||0)+(ok?0:1);record.streak=ok?Math.min(5,(record.streak||0)+1):0;record.due=Date.now()+(ok?[0,1,3,7,14,30][record.streak]*86400000:600000);record.lastTest=Date.now();write()}}render()}
function nextQuestion(){let r=state.round;if(!r?.answered)return;if(r.index===r.items.length-1){r.finished=true;db.sessions.push({date:day(),mode:state.mode,total:r.items.length,correct:r.correct,time:Date.now()});db.sessions=db.sessions.slice(-300);write()}else{r.index++;prepareQuestion()}render();window.scrollTo({top:0,behavior:'smooth'})}
function groupCard(g){return `<article class="panel group" role="button" tabindex="0" data-group="${g.id}" aria-label="学习${esc(g.label)}"><div class="group-head"><h3>${esc(g.label.replace(/⻅/g,'见'))}</h3><span class="badge">${status(g)}</span></div><p>${g.words.slice(0,4).map(esc).join(' · ')}${g.words.length>4?' …':''}</p><footer><span>${g.words.length} 个表达</span><span>打开 · 点词听音 ↗</span></footer></article>`}
function filtered(){let q=state.query.toLowerCase();return DATA.filter(g=>(!q||g.label.replace(/⻅/g,'见').includes(q)||g.words.some(w=>norm(w).includes(q)))&&(state.filter==='all'||state.filter==='new'&&status(g)==='未开始'||state.filter===status(g)))}
function atlas(){let list=filtered();return `<div class="toolbar"><input class="search" id="search" placeholder="搜索中文词义或英文单词" value="${esc(state.query)}" aria-label="搜索词组"><select class="filter" id="filter" aria-label="筛选词组">${[['all','全部词组'],['new','未接触'],['学习中','学习中'],['熟悉','识别熟悉']].map(([k,v])=>`<option value="${k}" ${state.filter===k?'selected':''}>${v}</option>`).join('')}</select></div><p class="small muted" id="resultCount">显示 ${list.length} / ${DATA.length} 组</p><div class="atlas" id="results">${list.map(groupCard).join('')||'<div class="panel empty">没有符合条件的词组</div>'}</div>`}
function refreshAtlas(){let list=filtered();$('#results').innerHTML=list.map(groupCard).join('')||'<div class="panel empty">没有符合条件的词组</div>';$('#resultCount').textContent=`显示 ${list.length} / ${DATA.length} 组`;bindGroups()}
function progress(){let old=learned(),mistakes=old.filter(x=>(wr(x).wrong||0)>0&&(wr(x).streak||0)<3).sort((a,b)=>wr(b).wrong-wr(a).wrong),sessions=db.sessions.filter(s=>s.date===day());return `<section class="grid3"><div class="panel stat"><span class="small muted">今日学过</span><b>${todayWords().length}</b></div><div class="panel stat"><span class="small muted">今日完成测试</span><b>${sessions.reduce((n,s)=>n+s.total,0)}</b></div><div class="panel stat"><span class="small muted">待巩固错词</span><b>${mistakes.length}</b></div></section><section class="section"><h2>按学习日期打乱复习</h2><div class="progress-list">${dates().map(d=>`<button data-day="${d}"><span>${d}</span><span class="muted">${old.filter(x=>wr(x).days.includes(d)).length} 个词 →</span></button>`).join('')||'<div class="panel empty">打开联想卡后，这里会记录每天接触的词。</div>'}</div></section><section class="section"><h2>错词识别</h2><div class="row spacer">${mistakes.length?'<button class="btn primary" data-all-mistakes>打乱测试这些错词</button>':''}</div><div class="chips spacer">${mistakes.slice(0,40).map(x=>wordButton(x.w)).join('')||'<p class="notice">暂无需要巩固的错词。</p>'}</div></section><section class="section panel" style="padding:25px"><h2>记录与备份</h2><p class="notice">记录保存在当前浏览器。旧版已接触词组自动迁移为词条记录；旧版默写等级不作为新版识词熟练度。换设备前导出，之后导入即可。</p><div class="row"><button class="btn outline" data-export>导出进度 JSON</button><label class="btn outline" style="cursor:pointer">导入进度 JSON<input type="file" id="import" accept="application/json,.json" hidden></label><button class="btn outline danger" data-reset>清空本机进度</button></div></section>`}
let activeAudio=null;
function speakText(text,button,kind='text'){if(activeAudio){activeAudio.pause();activeAudio=null}if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('.speaking').forEach(b=>b.classList.remove('speaking'));button?.classList.add('speaking');let finish=()=>button?.classList.remove('speaking');function deviceSpeech(){if(!('speechSynthesis'in window)){finish();toast('此浏览器暂不支持朗读，请尝试 Safari 或 Chrome');return}let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US'&&v.localService)||voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;u.onend=finish;u.onerror=()=>{finish();toast('读音未能播放，请检查设备声音或浏览器语音支持')};speechSynthesis.speak(u)}if(kind==='word'){let a=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type=2');activeAudio=a;let failed=false;function fallback(){if(failed||activeAudio!==a)return;failed=true;activeAudio=null;deviceSpeech()}a.onended=()=>{if(activeAudio===a)activeAudio=null;finish()};a.onerror=fallback;let promise=a.play();if(promise)promise.catch(fallback)}else deviceSpeech()}
function bindGroups(){document.querySelectorAll('[data-group]').forEach(el=>{el.onclick=()=>setPage('learn',+el.dataset.group);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}})}
function on(sel,fn){document.querySelectorAll(sel).forEach(el=>el.onclick=()=>fn(el))}
function bind(){on('[data-nav]',el=>setPage(el.dataset.nav));on('[data-go]',el=>setPage(el.dataset.go));bindGroups();on('[data-word]',el=>{markWord(el.dataset.word);speakText(el.dataset.word,el,'word')});on('[data-speak]',()=>speakText(group(state.id).words.join('. ')));on('[data-prev]',()=>setPage('learn',state.id-1));on('[data-next]',()=>setPage('learn',state.id+1));on('[data-random]',()=>setPage('learn',shuffle(DATA)[0].id));on('[data-start]',el=>configure(el.dataset.start));on('[data-due]',()=>configure('word','due'));on('[data-group-test]',()=>{state.mode='word';state.scope='group';state.round=null;setPage('quiz');startRound()});on('[data-mode]',el=>{state.mode=el.dataset.mode;state.round=null;render()});on('[data-begin]',()=>startRound());on('[data-restart]',()=>{state.round=null;startRound()});on('[data-option]',el=>answerQuestion(+el.dataset.option));on('[data-next-question]',nextQuestion);on('[data-quiz-audio]',el=>{let x=state.round.items[state.round.index];speakText(state.mode==='opinion'?x.sentence:state.mode==='context'?CONTEXTS.find(c=>c.key===x.key).sentence:x.w,el,state.mode==='word'?'word':'text')});on('[data-back-group]',el=>setPage('learn',+el.dataset.backGroup));on('[data-mistakes]',()=>startRound(state.round.wrong));on('[data-all-mistakes]',()=>{state.mode='word';state.scope='all';state.page='quiz';startRound(learned().filter(x=>(wr(x).wrong||0)>0&&(wr(x).streak||0)<3))});on('[data-day]',el=>{state.date=el.dataset.day;state.scope='date';state.mode='word';state.round=null;setPage('quiz')});let scope=$('#scope');if(scope)scope.onchange=e=>{state.scope=e.target.value;state.round=null;render()};let date=$('#study-date');if(date)date.onchange=e=>{state.date=e.target.value;state.round=null;render()};let search=$('#search');if(search)search.oninput=e=>{state.query=e.target.value;refreshAtlas()};let filter=$('#filter');if(filter)filter.onchange=e=>{state.filter=e.target.value;refreshAtlas()};on('[data-export]',()=>{let blob=new Blob([JSON.stringify({app:'reading-recognition-v2',exported:new Date().toISOString(),db,legacy},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='词义联想室-学习进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});let imp=$('#import');if(imp)imp.onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(v.app==='reading-recognition-v2'&&v.db?.words&&Array.isArray(v.db.sessions)){db=v.db;legacy=v.legacy||{};write();localStorage.setItem(KEY,JSON.stringify(legacy))}else if(v.app==='reading-association-v1'&&v.records){legacy=v.records;localStorage.setItem(KEY,JSON.stringify(legacy));for(let g of DATA)if(legacy[g.id]?.seen)for(let w of g.words){let k=norm(w),t=legacy[g.id].seen;if(!db.words[k])db.words[k]={days:[day(t)],first:t,last:t,streak:0,correct:0,wrong:0,due:0}}write()}else throw Error();render();toast('进度已导入')}catch{toast('文件格式不正确')}};on('[data-reset]',()=>{if(confirm('确定清空这台设备的学习进度吗？请先导出备份。')){db={words:{},sessions:[]};legacy={};localStorage.removeItem(KEY);write();state.round=null;render();toast('已清空本机进度')}})}
render();
</script></body></html>
